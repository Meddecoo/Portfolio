<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional To-Do App</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1220;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .container{
      width:380px;
      background:#111a2e;
      padding:20px;
      border-radius:12px;
      border:1px solid #1f2a44;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:15px;
    }

    .input-area{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:10px;
      border:none;
      border-radius:6px;
      outline:none;
    }

    button{
      padding:10px 15px;
      border:none;
      background:#38bdf8;
      color:black;
      font-weight:bold;
      border-radius:6px;
      cursor:pointer;
    }

    ul{
      list-style:none;
      padding:0;
      margin-top:20px;
    }

    li{
      background:#1f2a44;
      padding:10px;
      margin-top:10px;
      border-radius:8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
    }

    li.done{
      text-decoration:line-through;
      opacity:0.6;
    }

    .delete{
      background:red;
      color:white;
      border:none;
      padding:5px 10px;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>To-Do App</h1>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Enter task...">
      <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks(){
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks(){
      let list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        let li = document.createElement("li");
        li.className = task.done ? "done" : "";
        li.innerHTML = `
          <span onclick="toggleTask(${index})">${task.text}</span>
          <button class="delete" onclick="deleteTask(${index})">X</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask(){
      let input = document.getElementById("taskInput");
      let text = input.value.trim();

      if(text === ""){
        alert("Enter a task");
        return;
      }

      tasks.push({ text, done:false });
      saveTasks();
      renderTasks();
      input.value = "";
    }

    function deleteTask(index){
      tasks.splice(index,1);
      saveTasks();
      renderTasks();
    }

    function toggleTask(index){
      tasks[index].done = !tasks[index].done;
      saveTasks();
      renderTasks();
    }

    renderTasks();
  </script>

</body>
</html>
